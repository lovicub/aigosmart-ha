name: Validate
on:
  workflow_dispatch:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        crypto: ['48.0.1', '50.0.1']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install homeassistant==2026.10.2
      - run: python -m pip install --no-deps --target /tmp/aigosmart-crypto cryptography==${{ matrix.crypto }}
      - name: Verify imported crypto version and run offline tests
        env:
          PYTHONPATH: /tmp/aigosmart-crypto
          EXPECTED_CRYPTO: ${{ matrix.crypto }}
        run: |
          python -c "import os, cryptography; assert cryptography.__version__ == os.environ['EXPECTED_CRYPTO']"
          python -m unittest discover -s tests -v
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          comment: 'false'
